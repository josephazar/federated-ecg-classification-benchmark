name: Verify benchmark
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install the isolated environment and native library
        run: sh scripts/setup.sh
      - name: Download and prepare the public dataset
        run: |
          .venv/bin/python -m fedecg.data download
          .venv/bin/python -m fedecg.data preprocess
      - name: Check data separation, objectives and protection
        run: .venv/bin/python -m pytest -q
